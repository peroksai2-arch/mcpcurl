[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-probe"
version = "0.1.0"
description = "Inspect, call, smoke-test and document any Model Context Protocol server from the command line."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "peroksai2-arch" }]
keywords = ["mcp", "model-context-protocol", "cli", "testing", "llm", "tools", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "mcp>=1.10",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
mcp-probe = "mcp_probe.cli:app"

[project.urls]
Homepage = "https://github.com/peroksai2-arch/mcp-probe"
Issues = "https://github.com/peroksai2-arch/mcp-probe/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_probe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
